name: Android-App bauen

on:
  # Every push: tools/release.py takes the APK of the released commit
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Signierschlüssel bereitstellen
        env:
          KS_B64: ${{ secrets.FMA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/findmyanything.p12"
            echo "FMA_KEYSTORE=$RUNNER_TEMP/findmyanything.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Schlüssel hinterlegt, APK wird mit Debug-Schlüssel signiert"
          fi

      - name: APK bauen
        working-directory: android
        env:
          FMA_KS_PASS: ${{ secrets.FMA_KS_PASS }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: APK umbenennen
        run: |
          V=$(python3 -c "import json; print(json.load(open('watch/package.json'))['version'])")
          cp android/app/build/outputs/apk/release/app-release.apk "FindMyAnything-$V.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: findmyanything-apk
          path: FindMyAnything-*.apk
          retention-days: 30
